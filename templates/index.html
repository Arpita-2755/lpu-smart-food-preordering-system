<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Food Pre-Ordering</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
        }

        .navbar {
            transition: all 0.4s ease;
        }

        .navbar.scrolled {
            background-color: rgba(0,0,0,0.8) !important;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .btn-custom {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
        }

        .counter-box {
            background-color: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .logo {
            height: 40px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-transparent px-4">
    <a class="navbar-brand fw-bold" href="#">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/3b/Lovely_Professional_University_logo.png" class="logo">
        LPU Smart Food System
    </a>
</nav>

<div class="container py-5" style="margin-top:100px;">

    <!-- LIVE COUNTER -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-4">
            <div class="counter-box">
                <h4>Total Orders</h4>
                <h1 id="orderCounter">{{ total_orders }}</h1>
            </div>
        </div>
    </div>

    <!-- ORDER FORM -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-dark">
                <h4 class="text-center mb-3">Place Your Order</h4>

                <form method="POST" action="/order">
                    <div class="mb-3">
                        <input type="text" name="name" class="form-control" placeholder="Student Name" required>
                    </div>

                    <div class="mb-3">
                        <input type="text" name="food" class="form-control" placeholder="Food Item" required>
                    </div>

                    <div class="mb-3">
                        <select name="slot" class="form-select">
                            <option>10:00 AM</option>
                            <option>12:00 PM</option>
                            <option>2:00 PM</option>
                        </select>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-custom text-white px-4">
                            Submit Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- BAR CHART -->
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card p-4 text-dark">
                <h4 class="text-center mb-4">Peak Order Time Analysis</h4>
                <canvas id="orderChart"></canvas>
            </div>
        </div>
    </div>

</div>

<script>
    // Navbar animation on scroll
    window.addEventListener("scroll", function() {
        const navbar = document.querySelector(".navbar");
        navbar.classList.toggle("scrolled", window.scrollY > 50);
    });

    // Prepare chart data
    const labels = [
        {% for row in data %}
            "{{ row[0] }}",
        {% endfor %}
    ];

    const counts = [
        {% for row in data %}
            {{ row[1] }},
        {% endfor %}
    ];

    const ctx = document.getElementById('orderChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Number of Orders',
                data: counts,
                backgroundColor: '#0072ff'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            }
        }
    });
</script>

</body>
</html>
